#
# Config Hyprland em hyprlang — versão revisada
# Baseada na config original colada.
# Para Hyprland 0.55+, use isto como etapa intermediária antes de migrar para Lua.
#

# autogenerated = 1 # remova esta linha para remover o aviso

# -----------------------------------------------------------------------------
# Monitores
# -----------------------------------------------------------------------------
# Veja:
# https://wiki.hypr.land/0.54.0/Configuring/Monitors/

monitor = eDP-1, preferred, auto, 1.6
monitor = HDMI-A-1, preferred, auto-up, 1.6

# Fallback caso queira comentar os monitores específicos:
# monitor = , preferred, auto, 1

# -----------------------------------------------------------------------------
# Workspaces por monitor
# -----------------------------------------------------------------------------

# Workspaces no monitor interno
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

# Workspaces no monitor externo
workspace = 11, monitor:HDMI-A-1
workspace = 12, monitor:HDMI-A-1
workspace = 13, monitor:HDMI-A-1
workspace = 14, monitor:HDMI-A-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1
workspace = 20, monitor:HDMI-A-1

# -----------------------------------------------------------------------------
# Autostart
# -----------------------------------------------------------------------------

exec-once = fish -c autostart

# -----------------------------------------------------------------------------
# Arquivos externos
# -----------------------------------------------------------------------------

source = ~/.config/hypr/macchiato.conf

# -----------------------------------------------------------------------------
# Variáveis de ambiente
# -----------------------------------------------------------------------------

env = HYPRCURSOR_THEME, Catppuccin-Macchiato-Teal
env = HYPRCURSOR_SIZE, 24
env = XCURSOR_THEME, Catppuccin-Macchiato-Teal
env = XCURSOR_SIZE, 24

# XWayland disable scaling
# xwayland {
#     force_zero_scaling = true
# }

# env = GDK_SCALE, 1.6

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------

input {
    kb_layout = br
    kb_variant = abnt2
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-and-drag = true
    }

    sensitivity = 0
}

# -----------------------------------------------------------------------------
# Geral
# -----------------------------------------------------------------------------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $teal
    col.inactive_border = $surface1

    layout = dwindle
}

# -----------------------------------------------------------------------------
# Decoração
# -----------------------------------------------------------------------------

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 8
        passes = 2
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        offset = 0, 0
        color = $teal
        color_inactive = 0xff$baseAlpha
    }

    active_opacity = 0.7
    inactive_opacity = 0.7
    fullscreen_opacity = 0.7
}

# -----------------------------------------------------------------------------
# Layer rules
# -----------------------------------------------------------------------------
# Sintaxe nova hyprlang 0.54:
# layerrule = blur on, match:namespace waybar

# layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace logout_dialog

# -----------------------------------------------------------------------------
# Animações
# -----------------------------------------------------------------------------

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = windowsMove, 1, 2, myBezier, slide
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 1, default
}

# -----------------------------------------------------------------------------
# Layout dwindle
# -----------------------------------------------------------------------------

dwindle {
    # Em versões novas, não use mais pseudotile como opção fixa de config.
    # Use o dispatcher:
    # bind = $mainMod SHIFT, P, pseudo

    preserve_split = true
}

# -----------------------------------------------------------------------------
# Layout master
# -----------------------------------------------------------------------------

master {
    new_status = master
}

# -----------------------------------------------------------------------------
# Gestos
# -----------------------------------------------------------------------------

gesture = 3, horizontal, workspace

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x24273a
}

# -----------------------------------------------------------------------------
# Binds
# -----------------------------------------------------------------------------

binds {
    workspace_back_and_forth = true
}

# -----------------------------------------------------------------------------
# Config por dispositivo
# -----------------------------------------------------------------------------
# Confirme o nome exato com:
# hyprctl devices

device {
    name = epic mouse V1
    sensitivity = -0.5
}

# -----------------------------------------------------------------------------
# Window rules
# -----------------------------------------------------------------------------
# Convertido de windowrulev2 para windowrule novo.
# Confirme classes/títulos com:
# hyprctl clients

windowrule = match:class ^(mpv)$, float on, opaque on, size (monitor_w*0.5) (monitor_h*0.5)

windowrule = match:class ^(imv)$, float on, opaque on, size (monitor_w*0.7) (monitor_h*0.7)

# Atenção: regras estáticas baseadas em title dependem do título inicial da janela.
# Se PDF não funcionar bem, troque por match:class do leitor de PDF.
windowrule = match:title .*\.pdf$, float on, opaque on, maximize on

windowrule = match:title .*YouTube - Brave.*, opaque on

windowrule = match:class ^(swappy)$, float on, opaque on, center on, stay_focused on

# Scratchpads / pyprland
$dropterm = match:class ^(terminal-dropterm)$
windowrule = $dropterm, float on, pin on

$volume_sidemenu = match:class ^(org.pulseaudio.pavucontrol)$
windowrule = $volume_sidemenu, float on, pin on

# -----------------------------------------------------------------------------
# Variáveis de atalhos
# -----------------------------------------------------------------------------

$mainMod = SUPER

# -----------------------------------------------------------------------------
# Submap: resize
# -----------------------------------------------------------------------------

bind = $mainMod ALT, R, submap, resize

submap = resize

binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10

bind = , escape, submap, reset

submap = reset

# -----------------------------------------------------------------------------
# Submap: move
# -----------------------------------------------------------------------------

bind = $mainMod ALT, M, submap, move

submap = move

bind = , right, movewindow, r
bind = , left, movewindow, l
bind = , up, movewindow, u
bind = , down, movewindow, d

bind = , l, movewindow, r
bind = , h, movewindow, l
bind = , k, movewindow, u
bind = , j, movewindow, d

bind = , escape, submap, reset

submap = reset

# -----------------------------------------------------------------------------
# Scratchpads / Pyprland
# -----------------------------------------------------------------------------

bind = $mainMod CTRL, T, exec, pypr toggle term
bind = $mainMod CTRL, V, exec, pypr toggle volume

# -----------------------------------------------------------------------------
# Pyprland / special workspace
# -----------------------------------------------------------------------------

bind = $mainMod CTRL, M, togglespecialworkspace, minimized
bind = $mainMod, M, exec, pypr toggle_special minimized
bind = $mainMod CTRL, E, exec, pypr expose
bind = $mainMod, Z, exec, pypr zoom

# -----------------------------------------------------------------------------
# Apps
# -----------------------------------------------------------------------------

bind = $mainMod, T, exec, fish -c kitty_launch
bind = $mainMod SHIFT, T, exec, Telegram
bind = $mainMod, B, exec, qutebrowser
bind = $mainMod SHIFT, B, exec, brave
bind = $mainMod, F, exec, thunar
bind = $mainMod, S, exec, spotify
bind = $mainMod, Y, exec, pear-desktop
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod SHIFT, D, exec, firejail --apparmor discord

# Logout / lock
bind = $mainMod, ESCAPE, exec, fish -c wlogout_uniqe
bind = $mainMod SHIFT, L, exec, hyprlock

# Screenshots / gravação
bind = $mainMod SHIFT, S, exec, fish -c screenshot_to_clipboard
bind = $mainMod, E, exec, fish -c screenshot_edit
bind = $mainMod SHIFT, R, exec, fish -c record_screen_gif
bind = $mainMod, R, exec, fish -c record_screen_mp4

# Clipboard
bind = $mainMod, V, exec, fish -c clipboard_to_type
bind = $mainMod SHIFT, V, exec, fish -c clipboard_to_wlcopy
bind = $mainMod, X, exec, fish -c clipboard_delete_item
bind = $mainMod SHIFT, X, exec, fish -c clipboard_clear

# Bookmarks
bind = $mainMod, U, exec, fish -c bookmark_to_type
bind = $mainMod SHIFT, U, exec, fish -c bookmark_add
bind = $mainMod CTRL, U, exec, fish -c bookmark_delete

# Color picker
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod SHIFT, C, exec, pypr menu "Color picker"

# Janelas
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod CTRL, F, fullscreen, 0
bind = $mainMod SHIFT, P, pseudo,
bind = $mainMod SHIFT, O, layoutmsg, swapsplit

# IMPORTANTE:
# Removido/comentado porque conflita com:
# bind = $mainMod ALT, M, submap, move
#
# Além disso, em setups com uwsm, o dispatcher exit não é o ideal.
# Use seu wlogout/hyprshutdown/uwsm stop conforme seu setup.
#
# bind = $mainMod ALT, M, exit,

# Toggles de sistema
bind = $mainMod SHIFT, A, exec, fish -c airplane_mode_toggle
bind = $mainMod SHIFT, N, exec, dunstctl set-paused toggle
bind = $mainMod SHIFT, Y, exec, fish -c bluetooth_toggle
bind = $mainMod SHIFT, W, exec, fish -c wifi_toggle

# Player
bind = $mainMod, p, exec, playerctl play-pause
bind = $mainMod, bracketright, exec, playerctl next
bind = $mainMod, bracketleft, exec, playerctl previous

# Volume
bind = , XF86AudioRaiseVolume, exec, volumectl -u up
bind = , XF86AudioLowerVolume, exec, volumectl -u down
bind = , XF86AudioMute, exec, volumectl toggle-mute
bind = , XF86AudioMicMute, exec, volumectl -m toggle-mute

# Brilho
bind = , XF86MonBrightnessUp, exec, lightctl -D intel_backlight up
bind = , XF86MonBrightnessDown, exec, lightctl -D intel_backlight down

# -----------------------------------------------------------------------------
# Foco
# -----------------------------------------------------------------------------

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, alterzorder, top

# -----------------------------------------------------------------------------
# Workspaces — monitor interno
# -----------------------------------------------------------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# -----------------------------------------------------------------------------
# Workspaces — monitor externo
# -----------------------------------------------------------------------------

bind = $mainMod ALT, 1, workspace, 11
bind = $mainMod ALT, 2, workspace, 12
bind = $mainMod ALT, 3, workspace, 13
bind = $mainMod ALT, 4, workspace, 14
bind = $mainMod ALT, 5, workspace, 15
bind = $mainMod ALT, 6, workspace, 16
bind = $mainMod ALT, 7, workspace, 17
bind = $mainMod ALT, 8, workspace, 18
bind = $mainMod ALT, 9, workspace, 19
bind = $mainMod ALT, 0, workspace, 20

# -----------------------------------------------------------------------------
# Mover janela para workspace — monitor interno
# -----------------------------------------------------------------------------

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# -----------------------------------------------------------------------------
# Mover janela para workspace — monitor externo
# -----------------------------------------------------------------------------

bind = $mainMod ALT SHIFT, 1, movetoworkspace, 11
bind = $mainMod ALT SHIFT, 2, movetoworkspace, 12
bind = $mainMod ALT SHIFT, 3, movetoworkspace, 13
bind = $mainMod ALT SHIFT, 4, movetoworkspace, 14
bind = $mainMod ALT SHIFT, 5, movetoworkspace, 15
bind = $mainMod ALT SHIFT, 6, movetoworkspace, 16
bind = $mainMod ALT SHIFT, 7, movetoworkspace, 17
bind = $mainMod ALT SHIFT, 8, movetoworkspace, 18
bind = $mainMod ALT SHIFT, 9, movetoworkspace, 19
bind = $mainMod ALT SHIFT, 0, movetoworkspace, 20

# -----------------------------------------------------------------------------
# Scroll entre workspaces
# -----------------------------------------------------------------------------

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# -----------------------------------------------------------------------------
# Mouse move/resize
# -----------------------------------------------------------------------------

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow